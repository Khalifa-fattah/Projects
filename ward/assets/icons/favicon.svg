<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e9d2" />
      <stop offset="100%" stop-color="#c9b037" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1b4332" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />

  <!-- Outer ornamental circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Central Islamic prayer beads / crescent motif -->
  <g transform="translate(256, 235) scale(1.1)">
    <!-- Elegant open book / wings of peace -->
    <path d="M-90,60 C-60,40 -20,40 0,65 C20,40 60,40 90,60 C100,65 105,75 100,85 C95,95 80,95 70,85 C45,65 15,70 0,90 C-15,70 -45,65 -70,85 C-80,95 -95,95 -100,85 C-105,75 -100,65 -90,60 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Central Lamp/Star of guidance -->
    <polygon points="0,-120 18,-65 75,-65 30,-30 46,25 0,-5 -46,25 -30,-30 -75,-65 -18,-65" fill="url(#goldGrad)" transform="scale(0.5) translate(0, -90)" />

    <!-- Stylized Arabic Calligraphy of وِرد / Meem-Waw -->
    <text x="0" y="30" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', serif" font-size="115" font-weight="bold" fill="#f3e9d2" text-anchor="middle" dominant-baseline="middle">وِرد</text>
  </g>

  <!-- Bottom decorative subtitle -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="600" letter-spacing="4" fill="#a3b18a" text-anchor="middle">WIRD • أذكار وأدعية</text>
</svg>
