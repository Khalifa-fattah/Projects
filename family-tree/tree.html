<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشجرة الرسومية - شجرة العائلة</title>
  <link rel="stylesheet" href="css/tree.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- مكتبة رسم الشجرة OrgChart -->
  <script src="https://balkan.app/js/OrgChart.js"></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="main-title">الشجرة الرسومية</h1>
      <p class="subtitle">تصفح الشجرة المرئية لجميع الأجيال</p>
      <div class="header-buttons">
        <a href="index.html" class="btn-tree-nav">قائمة الأجيال</a>
        <a href="tree.html" class="btn-tree-nav" style="background-color: #3498db; color: white;">الشجرة المرئية</a>
        <a href="about.html" class="btn-tree-nav">عن العائلة</a>
        <a href="edit.html" class="btn-tree-nav" style="background-color: #e74c3c; color: white;">تعديل البيانات</a>
      </div>
    </div>
  </header>

  <!-- شريط التحكم والتكبير -->
  <div class="tree-toolbar">
    <button id="zoomInBtn" class="tree-btn" title="تكبير">+</button>
    <button id="zoomOutBtn" class="tree-btn" title="تصغير">-</button>
    <button id="fitBtn" class="tree-btn" title="ملاءمة الشاشة">⛶ ملاءمة الشاشة</button>
    <button id="centerRootBtn" class="tree-btn" title="العودة للجد الأكبر">🏠 رأس الشجرة</button>
    <span class="tree-hint">💡 انقر فوق أي شخص لفتح ملفه الشخصي</span>
  </div>

  <main>
    <!-- حاوية الشجرة -->
    <div id="tree"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="currentYear"></span> شجرة العائلة. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <!-- استدعاء ملف البيانات أولاً ثم ملف الشجرة -->
  <script src="js/data.js"></script>
  <script src="js/tree.js"></script>
</body>
</html>
