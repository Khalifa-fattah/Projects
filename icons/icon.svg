<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151f35"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8c1"/>
      <stop offset="1" stop-color="#2bb297"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6b3ff"/>
      <stop offset="1" stop-color="#6174e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="rgba(103,232,193,0.3)" stroke-width="6"/>

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="160" fill="#67e8c1" opacity="0.08" filter="url(#glow)"/>

  <!-- Code brackets </> -->
  <g transform="translate(256, 256)">
    <!-- Left bracket < -->
    <path d="M -50 -40 L -110 10 L -50 60" fill="none" stroke="url(#mint)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right bracket > -->
    <path d="M 50 -40 L 110 10 L 50 60" fill="none" stroke="url(#mint)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <path d="M -25 90 L 25 -70" fill="none" stroke="url(#blue)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
