<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI',
                   Tahoma, sans-serif;
    }

    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 35px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px
        rgba(0, 0, 0, 0.08);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1a1a1a;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #4a5568;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px
        rgba(49, 130, 206, 0.2);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .form-options a {
      color: #3182ce;
      text-decoration: none;
    }

    .form-options a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #2b6cb0;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #718096;
    }

    .signup-link a {
      color: #3182ce;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>تسجيل الدخول</h2>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="email">
          البريد الإلكتروني
        </label>
        <input type="email"
               id="email"
               name="email"
               placeholder="name@example.com"
               required>
      </div>

      <div class="form-group">
        <label for="password">
          كلمة المرور
        </label>
        <input type="password"
               id="password"
               name="password"
               placeholder="••••••••"
               required>
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox"
                 name="remember">
          تذكرني
        </label>
        <a href="#">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit"
              class="btn-submit">
        دخول
      </button>
    </form>

    <div class="signup-link">
      ليس لديك حساب؟
      <a href="#">إنشاء حساب جديد</a>
    </div>
  </div>

</body>
</html>
