<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F3D3A">
<title>محفظتي — رفيق حفظ القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F1E3;
    --paper-soft:#FBF7EE;
    --card:#FFFDF8;
    --ink:#1F3D3A;
    --ink-soft:#4B6B63;
    --ink-faint:#8A9E97;
    --gold:#B9922F;
    --gold-soft:#E7D6A6;
    --maroon:#7A2E2E;
    --line:#E4D9BE;
    --error-bg:#FBEAEA;
    --error-border:#EAC7C7;
    --shadow: 0 1px 0 rgba(31,61,58,0.06);
  }
  body.dark-theme{
    --paper:#141F1C;
    --paper-soft:#182722;
    --card:#1E2F2A;
    --ink:#ECE6D6;
    --ink-soft:#B9C4BE;
    --ink-faint:#728179;
    --gold:#D9B463;
    --gold-soft:#5B4A28;
    --maroon:#C24B4B;
    --line:#2B3B35;
    --error-bg:#3A1F1F;
    --error-border:#5C2E2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    transition:background .2s, color .2s;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(circle at 100% 0%, rgba(185,146,47,0.07), transparent 40%),
      var(--paper);
  }

  /* ---------- Header ---------- */
  header.top{
    padding:22px 20px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top .wordmark{
    font-family:'Amiri',serif;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:0.5px;
  }
  header.top .wordmark span{color:var(--gold);}
  header.top .date-hint{
    font-size:12px;
    color:var(--ink-faint);
  }
  header.top .top-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .theme-toggle{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
  }
  .theme-toggle svg{width:17px; height:17px;}

  /* ---------- Main scroll area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 96px;
  }
  section.view{display:none;}
  section.view.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .glyph{
    font-family:'Amiri',serif;
    font-size:42px;
    color:var(--gold-soft);
    margin-bottom:10px;
  }
  .empty-state p{margin:4px 0; font-size:14px; line-height:1.9;}
  .empty-state button{margin-top:14px;}

  /* ---------- Stats strip ---------- */
  .stats-strip{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .stat-box{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
  }
  .stat-box .num{
    font-family:'Amiri',serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    display:block;
  }
  .stat-box .lbl{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
    display:block;
  }

  /* ---------- Surah group ---------- */
  .surah-group{margin-bottom:14px;}
  .surah-group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px 8px;
  }
  .surah-group-head .name{
    font-family:'Amiri',serif;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .surah-group-head .progress{
    font-size:11px;
    color:var(--gold);
    font-weight:700;
  }
  .surah-group-head .progress.done{color:#3E7A5D;}

  .entry-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .entry-card:active{border-color:var(--gold);}
  .entry-marker{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:50%;
    border:1.5px solid var(--gold-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:13px;
    color:var(--gold);
  }
  .entry-body{flex:1; min-width:0;}
  .entry-range{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .entry-meta{
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:2px;
  }
  .entry-del{
    color:var(--ink-faint);
    background:none;
    border:none;
    font-size:18px;
    padding:4px 6px;
    cursor:pointer;
    line-height:1;
  }
  .entry-del:active{color:var(--maroon);}

  /* ---------- Buttons & Inputs ---------- */
  button{font-family:inherit;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:10px;
    padding:13px 18px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--ink); color:var(--paper-soft);}
  .btn-primary:active{background:#152D2A;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-gold{background:var(--gold); color:#2A2110;}

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field select, .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    font-size:15px;
  }
  .field select:focus, .field input:focus{outline:2px solid var(--gold-soft);}
  .field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .whole-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
    margin:-6px 0 16px;
    cursor:pointer;
    user-select:none;
  }
  .whole-toggle input{width:16px; height:16px;}
  .form-error{
    background:var(--error-bg);
    color:var(--maroon);
    border:1px solid var(--error-border);
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:14px;
    display:none;
  }
  .form-error.show{display:block;}
  h1.page-title{
    font-family:'Amiri',serif;
    font-size:21px;
    margin:2px 4px 18px;
  }

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--paper-soft);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    max-width:520px;
    margin:0 auto;
    width:100%;
  }
  nav.bottom button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 0;
    color:var(--ink-faint);
    cursor:pointer;
  }
  nav.bottom button.active{color:var(--ink);}
  nav.bottom button svg{width:22px; height:22px;}
  nav.bottom button span{font-size:11px; font-weight:700;}

  /* ---------- Review overlay ---------- */
  #reviewOverlay{
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:50;
    display:none;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
  }
  #reviewOverlay.active{display:flex;}
  .review-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper-soft);
  }
  .review-head .titles .t1{font-family:'Amiri',serif; font-size:19px; font-weight:700;}
  .review-head .titles .t2{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .review-close{
    background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer; padding:4px 8px;
  }
  .review-toolbar{
    display:flex;
    gap:8px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .review-toolbar button{
    flex:1;
    font-size:12.5px;
    padding:9px 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-weight:700;
    cursor:pointer;
  }
  .review-toolbar button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .review-body{flex:1; overflow-y:auto; padding:20px 20px 100px;}
  .ayah-line{
    font-family:'Amiri',serif;
    font-size:23px;
    line-height:2.3;
    text-align:justify;
    margin-bottom:6px;
  }
  .ayah-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    border:1px solid var(--gold-soft);
    border-radius:50%;
    font-family:'Tajawal',sans-serif;
    font-size:10.5px;
    color:var(--gold);
    vertical-align:middle;
    margin:0 4px;
  }
  .ayah-text{transition:filter .15s, opacity .15s; cursor:pointer;}
  .ayah-text.hidden-test{filter:blur(7px); opacity:.55;}
  .review-loading, .review-error{
    text-align:center; color:var(--ink-faint); padding:40px 20px; font-size:14px;
  }
  .review-error{color:var(--maroon);}
  .review-footer{
    position:absolute; bottom:0; left:0; right:0;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 60%, transparent);
  }
  .toast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:#20302B;
    color:#F5EFE0;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* ---------- Custom confirm modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(10,15,13,0.55);
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-backdrop.active{display:flex;}
  .modal-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px 20px 20px;
    max-width:340px;
    width:100%;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
    animation:fadeIn .2s ease;
  }
  .modal-card .modal-icon{
    font-family:'Amiri',serif;
    font-size:28px;
    color:var(--gold);
    margin-bottom:10px;
  }
  .modal-msg{
    font-size:14.5px;
    color:var(--ink);
    margin:0 0 18px;
    line-height:1.8;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{flex:1; padding:11px 10px;}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="wordmark">صاح<span>ب</span></div>
    <div class="top-right">
      <div class="date-hint" id="todayHint"></div>
      <button class="theme-toggle" id="themeToggleBtn" title="تبديل الوضع الليلي">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main>

    <!-- ============ LIST VIEW ============ -->
    <section class="view active" id="view-list">
      <h1 class="page-title">محفوظاتي</h1>
      <div class="stats-strip" id="listStatsStrip"></div>
      <div id="listContent"></div>
    </section>

    <!-- ============ ADD VIEW ============ -->
    <section class="view" id="view-add">
      <h1 class="page-title">إضافة حفظ جديد</h1>
      <div class="form-error" id="addError"></div>
      <div class="field">
        <label for="surahSelect">السورة</label>
        <select id="surahSelect"></select>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fromAyah">من آية</label>
          <input type="number" id="fromAyah" min="1" value="1">
        </div>
        <div class="field">
          <label for="toAyah">إلى آية</label>
          <input type="number" id="toAyah" min="1" value="1">
        </div>
      </div>
      <label class="whole-toggle">
        <input type="checkbox" id="wholeSurahBox">
        تحديد السورة كاملة
      </label>
      <div class="field hint" id="surahAyahHint" style="margin-top:-10px;"></div>
      <button class="btn btn-primary" id="saveEntryBtn">حفظ في قائمة المراجعة</button>
    </section>

    <!-- ============ STATS VIEW ============ -->
    <section class="view" id="view-stats">
      <h1 class="page-title">إحصائياتي</h1>
      <div id="statsContent"></div>
    </section>

  </main>

  <nav class="bottom">
    <button data-tab="list" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>محفوظاتي</span>
    </button>
    <button data-tab="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      <span>إضافة</span>
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>
      <span>الإحصائيات</span>
    </button>
  </nav>

  <!-- ============ REVIEW OVERLAY ============ -->
  <div id="reviewOverlay">
    <div class="review-head">
      <div class="titles">
        <div class="t1" id="reviewTitle">—</div>
        <div class="t2" id="reviewSubtitle">—</div>
      </div>
      <button class="review-close" id="reviewCloseBtn">✕</button>
    </div>
    <div class="review-toolbar">
      <button id="toggleHideBtn">إخفاء النص للاختبار</button>
      <button id="markReviewedBtn">✓ تمت المراجعة الآن</button>
    </div>
    <div class="review-body" id="reviewBody">
      <div class="review-loading">جارٍ تحميل الآيات…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ============ CONFIRM MODAL ============ -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal-card">
      <div class="modal-icon">﴾ ! ﴿</div>
      <p class="modal-msg" id="confirmMsg">هل أنت متأكد؟</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancelBtn">إلغاء</button>
        <button class="btn" id="confirmOkBtn" style="background:var(--maroon); color:#fff;">حذف</button>
      </div>
    </div>
  </div>

</div>

// =====================================================================
// محفظتي — رفيق حفظ القرآن الكريم
// تخزين محلي بالكامل على الجهاز (localStorage) + جلب نصوص الآيات من
// واجهة Al Quran Cloud API عند الحاجة للمراجعة فقط.
// =====================================================================

const STORAGE_KEY = 'quran_hifz_entries_v1';
const CACHE_KEY = 'quran_text_cache_v1';
const API_BASE = 'https://api.alquran.cloud/v1';
const EDITION = 'quran-uthmani';

let entries = loadEntries();
let textCache = loadCache();
let currentReviewEntry = null;
let hideTestMode = false;

// ---------------------------------------------------------------
// تخزين
// ---------------------------------------------------------------
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEntries() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(textCache)); }
  catch (e) { /* قد تمتلئ المساحة، تجاهل بصمت */ }
}

function surahByNumber(n) {
  return SURAHS.find(s => s.n === n);
}

// ---------------------------------------------------------------
// أدوات عامة
// ---------------------------------------------------------------
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function formatDate(iso) {
  if (!iso) return 'لم تُراجَع بعد';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------------------------------------------------------------
// الوضع الليلي
// ---------------------------------------------------------------
const MOON_ICON = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
const SUN_ICON = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';

function applyTheme(isDark) {
  document.body.classList.toggle('dark-theme', isDark);
  document.getElementById('themeIcon').innerHTML = isDark ? SUN_ICON : MOON_ICON;
  localStorage.setItem('quran_theme_v1', isDark ? 'dark' : 'light');
}
document.getElementById('themeToggleBtn').addEventListener('click', () => {
  applyTheme(!document.body.classList.contains('dark-theme'));
});
applyTheme(localStorage.getItem('quran_theme_v1') === 'dark');

// ---------------------------------------------------------------
// نافذة تأكيد مخصصة (بديل window.confirm الافتراضي)
// ---------------------------------------------------------------
function showConfirm(message, okLabel) {
  return new Promise((resolve) => {
    const backdrop = document.getElementById('confirmModal');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    document.getElementById('confirmMsg').textContent = message;
    okBtn.textContent = okLabel || 'حذف';
    backdrop.classList.add('active');

    function cleanup(result) {
      backdrop.classList.remove('active');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      backdrop.removeEventListener('click', onBackdrop);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onBackdrop(e) { if (e.target === backdrop) cleanup(false); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    backdrop.addEventListener('click', onBackdrop);
  });
}

// ---------------------------------------------------------------
// التنقل بين التبويبات
// ---------------------------------------------------------------
function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'list') renderList();
  if (tab === 'stats') renderStats();
  if (tab === 'add') resetAddForm();
}
document.querySelectorAll('nav.bottom button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ---------------------------------------------------------------
// تبويب: إضافة حفظ جديد
// ---------------------------------------------------------------
const surahSelect = document.getElementById('surahSelect');
SURAHS.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.n;
  opt.textContent = `${s.n}. ${s.name}`;
  surahSelect.appendChild(opt);
});

function resetAddForm() {
  document.getElementById('addError').classList.remove('show');
  document.getElementById('fromAyah').value = 1;
  document.getElementById('toAyah').value = 1;
  document.getElementById('wholeSurahBox').checked = false;
  updateSurahHint();
}
function updateSurahHint() {
  const s = surahByNumber(parseInt(surahSelect.value, 10));
  document.getElementById('surahAyahHint').textContent = s ? `عدد آيات هذه السورة: ${s.ayahs}` : '';
  document.getElementById('fromAyah').max = s ? s.ayahs : 286;
  document.getElementById('toAyah').max = s ? s.ayahs : 286;
  if (document.getElementById('wholeSurahBox').checked && s) {
    document.getElementById('fromAyah').value = 1;
    document.getElementById('toAyah').value = s.ayahs;
  }
}
surahSelect.addEventListener('change', updateSurahHint);
document.getElementById('wholeSurahBox').addEventListener('change', updateSurahHint);
updateSurahHint();

document.getElementById('saveEntryBtn').addEventListener('click', () => {
  const surahNum = parseInt(surahSelect.value, 10);
  const s = surahByNumber(surahNum);
  const from = parseInt(document.getElementById('fromAyah').value, 10);
  const to = parseInt(document.getElementById('toAyah').value, 10);
  const errBox = document.getElementById('addError');

  if (!from || !to || from < 1 || to < 1 || from > s.ayahs || to > s.ayahs) {
    errBox.textContent = `فضلاً أدخل أرقام آيات صحيحة بين 1 و${s.ayahs}.`;
    errBox.classList.add('show');
    return;
  }
  if (from > to) {
    errBox.textContent = 'رقم آية البداية يجب أن يكون أصغر من أو يساوي رقم النهاية.';
    errBox.classList.add('show');
    return;
  }
  errBox.classList.remove('show');

  entries.push({
    id: 'e' + Date.now() + Math.floor(Math.random() * 1000),
    surah: surahNum,
    surahName: s.name,
    from, to,
    dateAdded: todayStr(),
    lastReviewed: null,
    reviewCount: 0
  });
  saveEntries();
  showToast('تم الحفظ في قائمة المراجعة');
  switchTab('list');
});

// ---------------------------------------------------------------
// تبويب: محفوظاتي (القائمة)
// ---------------------------------------------------------------
function coveredMap() {
  // خريطة: رقم السورة -> مجموعة أرقام الآيات المحفوظة (لتفادي تكرار العد عند تداخل النطاقات)
  const map = new Map();
  entries.forEach(e => {
    if (!map.has(e.surah)) map.set(e.surah, new Set());
    const set = map.get(e.surah);
    for (let i = e.from; i <= e.to; i++) set.add(i);
  });
  return map;
}

function renderList() {
  const container = document.getElementById('listContent');
  const stripEl = document.getElementById('listStatsStrip');

  if (entries.length === 0) {
    stripEl.innerHTML = '';
    container.innerHTML = `
      <div class="empty-state">
        <div class="glyph">﴿ ٱقْرَأْ ﴾</div>
        <p>لا توجد آيات محفوظة بعد.</p>
        <p>ابدأ بإضافة أول مقطع تحفظه من القرآن الكريم.</p>
        <button class="btn btn-gold" onclick="switchTab('add')" style="width:auto; padding:12px 24px;">إضافة الآن</button>
      </div>`;
    return;
  }

  const cov = coveredMap();
  let totalAyat = 0;
  cov.forEach(set => totalAyat += set.size);
  let completedSurahs = 0;
  cov.forEach((set, surahNum) => {
    const s = surahByNumber(surahNum);
    if (s && set.size >= s.ayahs) completedSurahs++;
  });

  stripEl.innerHTML = `
    <div class="stat-box"><span class="num">${totalAyat}</span><span class="lbl">آية محفوظة</span></div>
    <div class="stat-box"><span class="num">${completedSurahs}</span><span class="lbl">سورة كاملة</span></div>
    <div class="stat-box"><span class="num">${cov.size}</span><span class="lbl">سورة قيد الحفظ</span></div>
  `;

  // تجميع حسب السورة، مرتبة برقم السورة
  const bySurah = new Map();
  entries.forEach(e => {
    if (!bySurah.has(e.surah)) bySurah.set(e.surah, []);
    bySurah.get(e.surah).push(e);
  });
  const sortedSurahNums = Array.from(bySurah.keys()).sort((a, b) => a - b);

  container.innerHTML = sortedSurahNums.map(surahNum => {
    const s = surahByNumber(surahNum);
    const list = bySurah.get(surahNum).sort((a, b) => a.from - b.from);
    const set = cov.get(surahNum);
    const isDone = s && set.size >= s.ayahs;
    const progressLabel = isDone ? 'محفوظة كاملة ✓' : `${set.size} / ${s.ayahs}`;

    const cards = list.map(e => `
      <div class="entry-card" data-id="${e.id}">
        <div class="entry-marker">${e.from}-${e.to}</div>
        <div class="entry-body">
          <div class="entry-range">الآيات ${e.from} إلى ${e.to} <span style="color:var(--ink-faint); font-weight:400;">(${e.to - e.from + 1} آية)</span></div>
          <div class="entry-meta">أُضيفت ${formatDate(e.dateAdded)} · ${e.lastReviewed ? 'آخر مراجعة ' + formatDate(e.lastReviewed) : 'لم تُراجَع بعد'}</div>
        </div>
        <button class="entry-del" data-del="${e.id}" title="حذف">🗑</button>
      </div>
    `).join('');

    return `
      <div class="surah-group">
        <div class="surah-group-head">
          <div class="name">${s.name}</div>
          <div class="progress ${isDone ? 'done' : ''}">${progressLabel}</div>
        </div>
        ${cards}
      </div>
    `;
  }).join('');

  // ربط الأحداث
  container.querySelectorAll('.entry-card').forEach(card => {
    card.addEventListener('click', (ev) => {
      if (ev.target.closest('[data-del]')) return;
      openReview(card.dataset.id);
    });
  });
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const ok = await showConfirm('هل تريد حذف هذا المقطع من قائمة المراجعة؟', 'حذف');
      if (ok) {
        entries = entries.filter(e => e.id !== btn.dataset.del);
        saveEntries();
        renderList();
        showToast('تم الحذف');
      }
    });
  });
}

// ---------------------------------------------------------------
// تبويب: الإحصائيات
// ---------------------------------------------------------------
function renderStats() {
  const container = document.getElementById('statsContent');
  const TOTAL_QURAN_AYAT = 6236;

  if (entries.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="glyph">﴿ ﴾</div>
      <p>أضف أول محفوظاتك لتظهر إحصائياتك هنا.</p>
    </div>`;
    return;
  }

  const cov = coveredMap();
  let totalAyat = 0;
  cov.forEach(set => totalAyat += set.size);
  let completedSurahs = 0;
  cov.forEach((set, surahNum) => {
    const s = surahByNumber(surahNum);
    if (s && set.size >= s.ayahs) completedSurahs++;
  });
  const pct = ((totalAyat / TOTAL_QURAN_AYAT) * 100).toFixed(2);

  const reviewed7 = entries.filter(e => {
    if (!e.lastReviewed) return false;
    const diffDays = (Date.now() - new Date(e.lastReviewed).getTime()) / 86400000;
    return diffDays <= 7;
  }).length;

  const neverReviewed = entries.filter(e => !e.lastReviewed).length;

  container.innerHTML = `
    <div class="stats-strip">
      <div class="stat-box"><span class="num">${totalAyat}</span><span class="lbl">آية محفوظة</span></div>
      <div class="stat-box"><span class="num">${completedSurahs}</span><span class="lbl">سورة كاملة</span></div>
      <div class="stat-box"><span class="num">${pct}%</span><span class="lbl">من القرآن</span></div>
    </div>
    <div class="entry-card" style="cursor:default;">
      <div class="entry-body">
        <div class="entry-range">راجعت ${reviewed7} مقطعًا خلال آخر ٧ أيام</div>
        <div class="entry-meta">${neverReviewed > 0 ? neverReviewed + ' مقطعًا لم تُراجَع بعد منذ إضافتها' : 'أحسنت! كل المقاطع رُوجعت مرة على الأقل'}</div>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------
// شاشة المراجعة (Overlay) — جلب نص الآيات وعرضها
// ---------------------------------------------------------------
const overlay = document.getElementById('reviewOverlay');
const reviewBody = document.getElementById('reviewBody');

async function getSurahAyahs(surahNum) {
  if (textCache[surahNum]) return textCache[surahNum];
  const res = await fetch(`${API_BASE}/surah/${surahNum}/${EDITION}`);
  if (!res.ok) throw new Error('network');
  const json = await res.json();
  const ayahs = json.data.ayahs.map(a => a.text);
  textCache[surahNum] = ayahs;
  saveCache();
  return ayahs;
}

async function openReview(entryId) {
  const entry = entries.find(e => e.id === entryId);
  if (!entry) return;
  currentReviewEntry = entry;
  hideTestMode = false;
  document.getElementById('toggleHideBtn').classList.remove('on');
  document.getElementById('toggleHideBtn').textContent = 'إخفاء النص للاختبار';

  document.getElementById('reviewTitle').textContent = entry.surahName;
  document.getElementById('reviewSubtitle').textContent = `الآيات ${entry.from} إلى ${entry.to}`;
  reviewBody.innerHTML = '<div class="review-loading">جارٍ تحميل الآيات…</div>';
  overlay.classList.add('active');

  try {
    const ayahs = await getSurahAyahs(entry.surah);
    const slice = [];
    for (let i = entry.from; i <= entry.to; i++) slice.push({ num: i, text: ayahs[i - 1] });
    reviewBody.innerHTML = slice.map(a => `
      <span class="ayah-line">
        <span class="ayah-text">${a.text}</span>
        <span class="ayah-num">${a.num}</span>
      </span>
    `).join(' ');
    reviewBody.querySelectorAll('.ayah-text').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('hidden-test'));
    });
  } catch (err) {
    reviewBody.innerHTML = `<div class="review-error">
      تعذّر الاتصال بالإنترنت لجلب نص الآيات.<br>
      تحتاج شبكة إنترنت أول مرة لعرض كل سورة، وبعدها تُحفظ نصوصها على جهازك للاستخدام لاحقًا دون اتصال.
    </div>`;
  }
}

document.getElementById('reviewCloseBtn').addEventListener('click', () => {
  overlay.classList.remove('active');
  renderList();
});

document.getElementById('toggleHideBtn').addEventListener('click', (e) => {
  hideTestMode = !hideTestMode;
  e.target.classList.toggle('on', hideTestMode);
  e.target.textContent = hideTestMode ? 'إظهار كل النص' : 'إخفاء النص للاختبار';
  reviewBody.querySelectorAll('.ayah-text').forEach(el => {
    el.classList.toggle('hidden-test', hideTestMode);
  });
});

document.getElementById('markReviewedBtn').addEventListener('click', () => {
  if (!currentReviewEntry) return;
  currentReviewEntry.lastReviewed = todayStr();
  currentReviewEntry.reviewCount = (currentReviewEntry.reviewCount || 0) + 1;
  saveEntries();
  showToast('أحسنت! سجّلنا مراجعتك اليوم');
  document.getElementById('reviewSubtitle').textContent =
    `الآيات ${currentReviewEntry.from} إلى ${currentReviewEntry.to} · رُوجعت ${currentReviewEntry.reviewCount} مرة`;
});

// ---------------------------------------------------------------
// تشغيل أولي
// ---------------------------------------------------------------
document.getElementById('todayHint').textContent = formatDate(todayStr());
renderList();

</script>
