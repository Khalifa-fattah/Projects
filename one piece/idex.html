<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Line Adventure Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght%40400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the One Piece/Adventure theme */
        :root {
            --luffy-red: #d93025;
            --luffy-yellow: #fdd835;
            --luffy-blue: #1e88e5;
            --ocean-blue: #00bcd4;
            --sand-color: #fcebb0;
            font-family: 'Inter', sans-serif;
        }

        body {
            cursor: crosshair; /* Hint for interaction */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Stylized beach background inspired by the image */
            background: linear-gradient(to bottom, var(--ocean-blue) 0%, var(--ocean-blue) 60%, var(--sand-color) 60%, var(--sand-color) 100%);
            background-size: 100% 100%;
        }

        .luffy-fist {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--luffy-red);
            box-shadow: 0 0 15px rgba(255, 100, 0, 0.8);
            transform: translate(-50%, -50%) scale(1.2);
            transition: transform 0.1s ease-out; /* For the 'hit' scale effect */
            z-index: 100;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .luffy-arm {
            position: absolute;
            background-color: var(--luffy-red);
            transform-origin: left center;
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Springy transition for extension */
            z-index: 90;
            height: 10px;
            pointer-events: none;
            left: 50%; /* Start from center */
            top: 50%;
        }

        .wanted-poster {
            animation: bounceIn 1s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* Animation for the ocean (subtle movement) */
        .ocean-wave {
            position: absolute;
            width: 100%;
            height: 60%;
            top: 0;
            opacity: 0.1;
            background: rgba(255, 255, 255, 0.5);
            animation: wave-move 10s infinite alternate;
        }

        @keyframes wave-move {
            from { transform: translateX(-5%); }
            to { transform: translateX(5%); }
        }

        /* Custom utility class for Luffy's Red */
        .bg-luffy-red {
            background-color: var(--luffy-red);
        }
    </style>
</head>
<body class="w-full h-screen" onclick="handleInteraction(event)">

    <!-- Background Ocean Layer -->
    <div class="ocean-wave"></div>

    <!-- Main Content: Wanted Poster Header -->
    <div class="absolute top-8 p-4 bg-yellow-300 border-4 border-black shadow-xl wanted-poster">
        <h1 class="text-4xl sm:text-6xl font-black text-red-800 text-center tracking-wider transform -rotate-1" style="text-shadow: 2px 2px 0 black, 4px 4px 0 white;">
            GRAND LINE ADVENTURE
        </h1>
        <p class="text-lg text-black font-bold text-center mt-2">انقر في أي مكان لاستخدام لكمة المطاط (Gum-Gum Pistol)!</p>
    </div>

    <!-- Treasure Button - Find the One Piece -->
    <button id="treasureButton" class="absolute bottom-10 p-4 bg-yellow-600 hover:bg-yellow-500 text-white font-bold text-xl rounded-full shadow-lg transition duration-300 transform hover:scale-105 active:scale-95 z-50">
        <span class="mr-2">🏴‍☠️</span> اعثر على الـ One Piece <span class="ml-2">💰</span>
    </button>


    <script>
        const body = document.body;
        const treasureButton = document.getElementById('treasureButton');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        // Note: Firebase is not used here, but variables are included as per standard instruction.

        /**
         * Cleans up the arm and fist elements after the punch animation is complete.
         * @param {HTMLElement} arm - The arm element.
         * @param {HTMLElement} fist - The fist element.
         */
        function cleanupPunch(arm, fist) {
            // Step 3: Retract/Cleanup
            setTimeout(() => {
                // Quickly reset arm width to zero and fist back to origin
                arm.style.width = '0px';
                arm.style.opacity = '0';
                fist.style.transition = 'all 0.3s ease-in';
                fist.style.transform = 'translate(-50%, -50%) scale(0.5)';

                // Remove the elements after they retract
                setTimeout(() => {
                    arm.remove();
                    fist.remove();
                }, 300);
            }, 150); // Short delay after the 'hit'
        }

        /**
         * Calculates the angle and distance between two points (center and click).
         * @param {number} x1 - Start X (center).
         * @param {number} y1 - Start Y (center).
         * @param {number} x2 - End X (click).
         * @param {number} y2 - End Y (click).
         * @returns {{distance: number, angle: number}}
         */
        function calculatePunchGeometry(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const distance = Math.sqrt(dx * dx + dy * dy);
            // Angle in radians, then converted to degrees
            const angle = Math.atan2(dy, dx) * (180 / Math.PI);
            return { distance, angle };
        }

        /**
         * Handles the main click/touch interaction for the Gum-Gum Pistol effect.
         * @param {MouseEvent|TouchEvent} event - The DOM event.
         */
        function handleInteraction(event) {
            // Prevent the punch if the button was clicked
            if (event.target.closest('#treasureButton')) {
                return;
            }

            // Determine the click position
            const clientX = event.clientX || event.touches[0].clientX;
            const clientY = event.clientY || event.touches[0].clientY;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const { distance, angle } = calculatePunchGeometry(centerX, centerY, clientX, clientY);

            // 1. Create Arm Element (Stretching Line)
            const arm = document.createElement('div');
            arm.className = 'luffy-arm';
            arm.style.transform = `rotate(${angle}deg)`;
            body.appendChild(arm);

            // 2. Create Fist Element (The Impact)
            const fist = document.createElement('div');
            fist.className = 'luffy-fist';
            fist.innerHTML = '✊'; // Fist emoji
            fist.style.left = `${centerX}px`;
            fist.style.top = `${centerY}px`;
            body.appendChild(fist);

            // Use requestAnimationFrame to ensure CSS transitions start correctly after element insertion
            requestAnimationFrame(() => {
                // Step 2a: Punch out!
                arm.style.width = `${distance}px`;
                fist.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                fist.style.left = `${clientX}px`;
                fist.style.top = `${clientY}px`;

                // Step 2b: Impact effect (scale up briefly)
                setTimeout(() => {
                    fist.style.transform = 'translate(-50%, -50%) scale(1.5)';
                }, 300); // Wait for punch to extend

                // Step 3: Cleanup/Retract
                cleanupPunch(arm, fist);
            });
        }

        // Add event listener to the treasure button
        treasureButton.addEventListener('click', () => {
            alertMessage('لقد وجدت... الصداقة! وكمية لا نهائية من اللحم!', '🎉');
        });

        // Add touch support for the main interaction area
        document.addEventListener('touchstart', (e) => {
            // Check if touch is on the button
            if (!e.target.closest('#treasureButton')) {
                 // Prevent default browser behavior (e.g., scrolling) but allow click emulation
                e.preventDefault();
                handleInteraction(e);
            }
        });

        /**
         * Custom alert box instead of window.alert
         * @param {string} message - The message to display.
         * @param {string} icon - An icon emoji.
         */
        function alertMessage(message, icon) {
            const existingModal = document.getElementById('custom-modal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-modal';
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center border-4 border-red-500 transform scale-0 transition-transform duration-300" id="modal-content">
                    <div class="text-6xl mb-4">${icon}</div>
                    <p class="text-xl font-bold text-gray-800">${message}</p>
                    <button id="close-modal" class="mt-6 px-6 py-2 bg-luffy-red text-white font-bold rounded-lg hover:bg-red-700 transition duration-200">
                        رائع!
                    </button>
                </div>
            `;
            body.appendChild(modal);

            // Animate in
            requestAnimationFrame(() => {
                document.getElementById('modal-content').style.transform = 'scale(1)';
            });

            document.getElementById('close-modal').onclick = () => {
                document.getElementById('modal-content').style.transform = 'scale(0)';
                setTimeout(() => modal.remove(), 300);
            };
        }

        // Add a friendly greeting on load
        window.onload = () => {
             alertMessage('مرحبًا بك في الجراند لاين! جومو جومو نو...', '🏴‍☠️');
        }

    </script>
</body>
</html>
